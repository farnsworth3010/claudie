# A tag vX.Y.Z publishes a GitHub release with the daemon for every platform, which the plugin's
# SessionStart hook downloads for its version, and with the Mac app built after it.
name: release

# The tag trigger is off for now, releases are made by hand; a workflow needs some trigger to stay valid.
on:
  # push:
  #   tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/daemon/go.mod
          cache-dependency-path: backend/daemon/go.sum
      - name: The tag matches the plugin's version
        run: |
          version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' backend/plugin/.claude-plugin/plugin.json)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, plugin.json says $version"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: tools/build-daemons.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" backend/daemon/bin/release/* --title "$GITHUB_REF_NAME" --generate-notes

  app:
    needs: release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: tools/build-macos-app.sh
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" frontends/macos/.build/app/Claudie-macos.zip
